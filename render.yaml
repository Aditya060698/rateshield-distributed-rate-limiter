services:
  - type: web
    name: rateshield-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: rateshield-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: rateshield-redis
          property: port
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: rateshield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: rateshield-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
